[package]
name = "p2p-secure-rust"
version = "0.3.0"
edition = "2021"

[dependencies]
base64 = "0.22"
futures = "0.3"
hex = "0.4"
rand = "0.8"
libp2p = { version = "0.56", features = ["tokio", "tcp", "noise", "yamux", "gossipsub", "mdns", "macros", "ed25519", "relay", "dcutr", "kad", "identify", "dns", "ping"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
